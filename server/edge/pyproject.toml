[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigyellow-beacon-edge"
version = "2.0.0"
description = "BigYellow Beacon shipboard edge server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "sqlalchemy>=2.0.28",
  "psycopg2-binary>=2.9.9",
  "pydantic>=2.6.4",
  "pydantic-settings>=2.2.1",
  "python-jose[cryptography]>=3.3.0",
  "PyJWT>=2.8.0",
  "passlib[argon2]>=1.7.4",
  "argon2-cffi>=23.1.0",
  "python-dotenv>=1.0.1",
  "faster-whisper>=1.0.0",
  "av>=12,<15",
  "requests>=2.31.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
gpu = [
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12==9.*",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["contract*", "middleware*", "routes*", "services*", "scripts*"]
