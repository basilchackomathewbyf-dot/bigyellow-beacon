# Edge stack: Postgres+pgvector on host :5433. Ollama runs natively on the host.
services:
  db:
    image: pgvector/pgvector:pg16
    # Host 5433 avoids clashing with a local Postgres on 5432.
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon
      POSTGRES_DB: beacon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon -d beacon"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - beacon

  api:
    build: .
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      BEACON_VESSEL_ID: v-0007
      BEACON_VESSEL_CODE: "0007"
      BEACON_VESSEL_NAME: "MV Demo Star"
      BEACON_VESSEL_SECRET: demo-vessel-secret-v-0007
      BEACON_EDGE_URL: https://beacon.ship.local:8443
      BEACON_DATABASE_URL: postgresql+asyncpg://beacon:beacon@db:5432/beacon
      # Generate: python -c "import secrets; print(secrets.token_urlsafe(48))"
      BEACON_JWT_SECRET: 9iL7AdvYMQ_TJPHnSbckQveubr51-XmB8cdPzmGzWBGqVP2zkRi2BKmJeiTUlCEd
      BEACON_AI: fake
      BEACON_DATA_DIR: /data
      BEACON_WEB_DIST: /app/crew-web
      BEACON_ROSTER_FILE: /app/seed/crew_v-0007.json
      BEACON_LINK_OVERRIDE: auto
      BEACON_K_ANON: "5"
    volumes:
      - api_data:/data
      - ../seed:/app/seed:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - beacon

networks:
  beacon:
    driver: bridge

volumes:
  pgdata:
  api_data:
